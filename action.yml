name: 'Cache Line Optimizer'
description: 'Go static analyzer for cache line optimization - detects structs that benefit from padding'
author: 'flaticols'

branding:
  icon: 'cpu'
  color: 'orange'

inputs:
  path:
    description: 'Path to analyze (default: ./...)'
    required: false
    default: './...'
  cache-line-size:
    description: 'Cache line size: auto, 64, or 128'
    required: false
    default: 'auto'
  analyze-all:
    description: 'Analyze all structs, not just hot paths'
    required: false
    default: 'false'
  pprof:
    description: 'Path to CPU/memory profile for hot path detection'
    required: false
    default: ''
  ignore:
    description: 'Comma-separated patterns to ignore'
    required: false
    default: ''
  output:
    description: 'Output format: text or json'
    required: false
    default: 'text'
  version:
    description: 'Version of pleasehitcache to use (default: latest)'
    required: false
    default: 'latest'

outputs:
  findings-count:
    description: 'Number of structs needing optimization found'
    value: ${{ steps.analyze.outputs.findings-count }}
  exit-code:
    description: 'Exit code from the analyzer (0 if successful)'
    value: ${{ steps.analyze.outputs.exit-code }}
  version:
    description: 'Version of pleasehitcache used'
    value: ${{ steps.download.outputs.version }}

runs:
  using: 'composite'
  steps:
    - name: Setup - Download and install pleasehitcache binary
      id: download
      shell: bash
      run: |
        # Determine version
        VERSION="${{ inputs.version }}"
        if [ "$VERSION" = "latest" ]; then
          echo "Fetching latest version..."
          VERSION=$(curl -s https://api.github.com/repos/flaticols/pleasehitcache/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

        # Determine platform and architecture
        OS=$(uname -s)
        ARCH=$(uname -m)

        # Map to release naming convention
        case "$OS" in
          Linux) PLATFORM="Linux" ;;
          Darwin) PLATFORM="Darwin" ;;
          *) echo "Unsupported OS: $OS"; exit 1 ;;
        esac

        case "$ARCH" in
          x86_64) ARCH="x86_64" ;;
          aarch64|arm64) ARCH="arm64" ;;
          i386|i686) ARCH="i386" ;;
          *) echo "Unsupported architecture: $ARCH"; exit 1 ;;
        esac

        # Download and extract
        FILENAME="pleasehitcache_${PLATFORM}_${ARCH}.tar.gz"
        URL="https://github.com/flaticols/pleasehitcache/releases/download/${VERSION}/${FILENAME}"

        echo "Downloading pleasehitcache ${VERSION} for ${PLATFORM}_${ARCH}..."
        curl -L -o pleasehitcache.tar.gz "$URL"
        tar -xzf pleasehitcache.tar.gz
        chmod +x pleasehitcache

        # Add to PATH
        echo "$PWD" >> $GITHUB_PATH

    - name: Analyze - Run pleasehitcache on codebase
      id: analyze
      shell: bash
      run: |
        FLAGS=""
        if [ "${{ inputs.cache-line-size }}" != "auto" ]; then
          FLAGS="$FLAGS -cache-line-size=${{ inputs.cache-line-size }}"
        fi
        if [ "${{ inputs.analyze-all }}" == "true" ]; then
          FLAGS="$FLAGS -analyze-all"
        fi
        if [ -n "${{ inputs.pprof }}" ]; then
          FLAGS="$FLAGS -pprof=${{ inputs.pprof }}"
        fi
        if [ -n "${{ inputs.ignore }}" ]; then
          FLAGS="$FLAGS -ignore=${{ inputs.ignore }}"
        fi
        if [ "${{ inputs.output }}" != "text" ]; then
          FLAGS="$FLAGS -output=${{ inputs.output }}"
        fi

        echo "Running: pleasehitcache $FLAGS ${{ inputs.path }}"

        # Run analyzer and capture output
        OUTPUT=$(pleasehitcache $FLAGS ${{ inputs.path }} 2>&1) || EXIT_CODE=$?

        # Only echo output if it's not empty
        if [ -n "$OUTPUT" ]; then
          echo "$OUTPUT"
        fi

        # Parse output for metrics
        if [ -n "$OUTPUT" ]; then
          FINDINGS_COUNT=$(echo "$OUTPUT" | grep -c "struct '" || echo "0")
        else
          FINDINGS_COUNT=0
        fi

        # Set outputs
        echo "findings-count=${FINDINGS_COUNT}" >> "$GITHUB_OUTPUT"
        echo "exit-code=${EXIT_CODE:-0}" >> "$GITHUB_OUTPUT"

        # Exit with original exit code
        exit ${EXIT_CODE:-0}
